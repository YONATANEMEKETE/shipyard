packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  msw: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

# GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 stack exhaustion.
# @prisma/config pins 7.1.5 exactly; override to the patched line.
overrides:
  deepmerge-ts: 8.0.1
  # better-auth 1.7.1 (runtime) peers better-call 1.4.0 exactly, but pnpm
  # resolved the shared peer to the CLI chain's 1.1.8; pin better-call so the
  # runtime ESM import of better-auth resolves kAPIErrorHeaderSymbol.
  better-call: 1.4.0
  # @better-auth/cli@1.4.x pins vulnerable better-auth <1.6.22
  # (GHSA-g38m-r43w-p2q7, GHSA-fmh4-wcc4-5jm3, GHSA-qq9h-g4jm-xgf3).
  # Force only vulnerable copies onto the patched 1.7.x line.
  'better-auth@<1.6.22': ^1.7.1
  # drizzle-orm <0.45.2 SQL injection via improperly escaped SQL identifiers
  # (GHSA-gpj5-g38j-94v9); pulled transitively by better-auth's drizzle adapter.
  'drizzle-orm@<0.45.2': ^0.45.2
  # lodash <=4.17.23: code injection via _.template (high) and prototype
  # pollution (moderate) — force only vulnerable copies to the patched release.
  'lodash@<=4.17.23': ^4.17.24
  # fast-uri <3.1.6: SSRF / host confusion via percent-decoding and scheme
  # normalization (GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-
  # hqxp) — pulled transitively by ajv (commitlint, prisma@7 stream tooling).
  'fast-uri@<3.1.6': ^3.1.6
  # mysql2 <3.22.0: auth-plugin downgrade to mysql_clear_password leaks
  # credentials (GHSA-3f6p-5ww8-9rcr) + unbounded zlib inflate (moderate) —
  # pulled by prisma@7 and drizzle-orm (better-auth's driver chain).
  'mysql2@<3.22.0': ^3.22.0
  # qs <6.16.0: array-limit bypass and DoS via attacker-controlled isBuffer
  # (transitive of express→body-parser and supertest→superagent).
  'qs@<6.16.0': ^6.16.0
