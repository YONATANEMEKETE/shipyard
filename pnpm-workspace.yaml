packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  cpu-features: false
  esbuild: true
  msw: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

# GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 stack exhaustion.
# @prisma/config pins 7.1.5 exactly; override to the patched line.
overrides:
  deepmerge-ts: 8.0.1
