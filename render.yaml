# Render blueprint for the Shipyard API (ADR-007).
#
#   Dashboard → New → Blueprint → this repository. Env vars marked
#   `sync: false` are prompted for during setup; BETTER_AUTH_SECRET is
#   generated by Render.
#
# Region: frankfurt pairs with a Neon project in eu-central-1 — keep the two
# in the same region so every query is not a transatlantic round trip.

services:
  - type: web
    name: shipyard-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - api.shipyard.yonatanem.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://api.shipyard.yonatanem.com
      - key: WEB_URL
        value: https://shipyard.yonatanem.com
      - key: COOKIE_DOMAIN
        value: yonatanem.com
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: R2_PUBLIC_BUCKET
        value: shipyard-bucket
      - key: R2_PUBLIC_BASE_URL
        value: https://assets.yonatanem.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Error monitoring (shipyard-api project). The DSN is write-only and safe
      # to expose, but it is per-project — self-hosters bring their own.
      - key: SENTRY_API_DSN
        sync: false
      # Product analytics (PostHog). The token is write-only and per-product;
      # self-hosters bring their own, or leave it unset to keep the reporter off.
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      # Server telemetry (OpenTelemetry → Grafana Cloud). The endpoint and
      # headers come from the stack's OpenTelemetry tile; the headers value is
      # a secret. Self-hosters bring their own, or leave it unset to keep
      # telemetry off.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
